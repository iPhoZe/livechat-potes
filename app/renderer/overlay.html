<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: http: data: blob:; media-src 'self' https: http: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Overlay</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }

    .card {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 42vw;
      border-radius: 18px;
      overflow: hidden;
      background: #15121f;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 0 0 2px rgba(255, 255, 255, .08);
      animation: pop-in 320ms cubic-bezier(.2, 1.4, .4, 1) both;
    }
    .card.leaving { animation: pop-out 220ms ease-in both; }

    .card img, .card video {
      display: block;
      max-width: 42vw;
      max-height: 46vh;
      min-width: 220px;
      object-fit: contain;
      background: #000;
    }

    .audio-bubble {
      display: grid;
      place-items: center;
      width: 260px;
      height: 150px;
      font-size: 64px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
    }
    .audio-bubble span { animation: pulse 900ms ease-in-out infinite; }

    .progress {
      height: 4px;
      background: rgba(255, 255, 255, .08);
    }
    .progress > div {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      transform-origin: left;
    }

    .caption {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
    }
    .avatar {
      flex: none;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .caption .body { min-width: 0; overflow-wrap: anywhere; }
    .caption .from { color: #e9d5ff; margin-right: 6px; }
    .caption .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      margin-left: 6px;
      vertical-align: middle;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: scale(.6) rotate(-3deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes pop-out {
      to { opacity: 0; transform: scale(.8); }
    }
    @keyframes pulse {
      50% { transform: scale(1.12); }
    }
  </style>
</head>
<body>
  <script src="overlay.js"></script>
</body>
</html>
